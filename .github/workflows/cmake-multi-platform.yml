# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: Build and test all supported platforms

# Our event to trigger this workflow
on:
  push:
    branches: [ "master", "ga-test" ]
  pull_request:
    branches: [ "master", "ga-test" ]

# Build all supported platforms
jobs:
  desktop:
    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false
      
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        build_type: [Release]

    steps:
    - uses: actions/checkout@v4

    - name: Set reusable strings
      # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

        # Lowercase build type once (Release -> release, Debug -> debug)
        bt_lower=$(echo "${{ matrix.build_type }}" | tr '[:upper:]' '[:lower:]')
        echo "build-type-lower=$bt_lower" >> "$GITHUB_OUTPUT"

    - name: Set up MSVC (Windows only)
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install Conan
      uses: conan-io/setup-conan@v1

    - name: Install Dependencies
      shell: bash
      # Use conan to install dependencies and tooling for the build type
      run: >
        build_type_lower=$(echo "${BUILD_TYPE}" | tr '[:upper:]' '[:lower:]')
        conan install . -of build -s build_type=${{ matrix.build_type }} --build=missing -s compiler.cppstd=17 -c tools.cmake.cmaketoolchain:generator=Ninja
    
    - name: Configure CMake
      shell: bash
      # Configure CMake using the above build directory and toolchain file generated by Conan
      run: cmake --preset conan-${{ steps.strings.outputs.build-type-lower }}

    - name: Build
      shell: bash
      run: cmake --build --preset conan-${{ steps.strings.outputs.build-type-lower }}
      
    - name: Install
      shell: bash
      run: cmake --install "${{ github.workspace }}/build/build/${{ matrix.build_type }}" --config ${{ matrix.build_type }} --prefix "${{ github.workspace }}/install"

    # Integration Tests ------------------------------------

    - name: Configure CMake for Integration Tests
      shell: bash
      # Configure CMake using the above build directory and toolchain file generated by Conan
      run: |
        cmake -S "${{ github.workspace }}/IntegrationTests/Desktop" \
          -B "${{ github.workspace }}/IntegrationTests/Desktop/build" \
          -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/build/build/${{ matrix.build_type }}/generators/conan_toolchain.cmake" \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DCMAKE_FIND_DEBUG_MODE=ON \
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}/install"


    - name: Build Integration Tests
      shell: bash
      run: cmake --build "${{ github.workspace }}/IntegrationTests/Desktop/build" --config ${{ matrix.build_type }}

    - name: Run Integration Tests
      shell: bash
      run: ctest --test-dir "${{ github.workspace }}/IntegrationTests/Desktop/build" -C ${{ matrix.build_type }} -V

  ios-visionos:
    runs-on: ${{ matrix.os }}

  strategy:
    # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
    fail-fast: false
      
    matrix:
      include:
        - platform: ios
          sdk: iphonesimulator
          destination: 'platform=iOS Simulator,name=iPhone 15'
          profile: ios_sim_arm
        - platform: visionos
          sdk: xrsimulator
          destination: 'platform=visionOS Simulator,name=Apple Vision Pro'
          profile: visionos_sim_arm

    steps:
    - uses: actions/checkout@v4

    - name: Set reusable strings
      # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

        # Lowercase build type once (Release -> release, Debug -> debug)
        bt_lower=$(echo "${{ matrix.build_type }}" | tr '[:upper:]' '[:lower:]')
        echo "build-type-lower=$bt_lower" >> "$GITHUB_OUTPUT"

    - name: Install Dependencies
      shell: bash
      # Use conan to install dependencies and tooling for the build type
      run: >
        build_type_lower=$(echo "${BUILD_TYPE}" | tr '[:upper:]' '[:lower:]')
        conan install . -of build -s build_type=${{ matrix.build_type }} --build=missing --profile:host="${{ github.workspace }}/profiles/host/${{ matrix.profile }}"

    - name: Configure CMake
      shell: bash
      # Configure CMake using the above build directory and toolchain file generated by Conan
        run: cmake --preset conan-${{ steps.strings.outputs.build-type-lower }}
  
